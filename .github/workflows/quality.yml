name: Quality Gate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and audit
        run: npm run check
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
